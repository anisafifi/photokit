# GoReleaser configuration. Run by .github/workflows/release.yml when a tag
# like v1.2.3 is pushed. Test locally with: goreleaser release --snapshot --clean
version: 2
project_name: photokit

builds:
  - id: photokit
    main: ./cmd/photokit
    binary: photokit
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X photokit/internal/version.Version={{.Version}}
      - -X photokit/internal/version.Commit={{.ShortCommit}}
      - -X photokit/internal/version.Date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - presets/*
      - assets/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  # v1.0.0-rc.1 style tags are published as pre-releases automatically.
  prerelease: auto
  footer: |
    ## Requirements

    PhotoKit needs [ExifTool](https://exiftool.org) 12 or newer installed separately.
    Run `photokit version` after installing to verify. See the README for installation steps.

    Verify your download with `checksums.txt` (SHA-256).
